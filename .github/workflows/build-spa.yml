name: build-spa

# Auto-rebuilds anyonemap-worker.js from index.html whenever the SPA source
# (or its build inputs) change, and commits the rebuilt worker back to main.
#
# 2026-10-16: this job used to run the OLD scripts/build-worker.js (no XSS
# lint, no dead-id/dead-fn gates, no i18n split, no minify, no CSP hashing)
# and committed a worker that still contained the literal
# `__I18N_PACKS_PLACEHOLDER__` — a ReferenceError at module load, i.e. a
# worker that could never serve a request — while also bumping
# WORKER_VERSION in worker-shell.js away from the developer's copy.
# It now runs the real build (root build-worker.js, the same `npm run build`
# used before every wrangler deploy), which fails closed on any gate.
#
# Loop prevention:
#   - The 'paths' filter excludes anyonemap-worker.js itself, so the
#     auto-commit cannot re-trigger this workflow.
#   - The auto-commit message includes [skip ci] as belt-and-suspenders.

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'worker-shell.js'
      - 'kv-schema.js'
      - 'build-worker.js'
      - 'lint-xss.js'
      - 'csp-inline.js'
      - 'check-dead-ids.js'
      - 'check-dead-fns.js'
      - 'check-scripts.mjs'
      - 'dead-ids.allow'
      - 'dead-fns.allow'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies (html-minifier-terser)
        run: npm install --no-audit --no-fund

      - name: Run the real build (all gates)
        run: npm run build

      - name: Sanity-check the built worker
        run: |
          set -e
          grep -q 'sha256-' anyonemap-worker.js || { echo "::error::no CSP hashes in built worker"; exit 1; }
          if grep -q '__I18N_PACKS_PLACEHOLDER__\|__INDEX_HTML_PLACEHOLDER__\|__KV_SCHEMA_PLACEHOLDER__' anyonemap-worker.js; then
            echo "::error::a build placeholder survived into anyonemap-worker.js"; exit 1
          fi
          node -e "new Function(require('fs').readFileSync('anyonemap-worker.js','utf8').replace(/^export default/m,'module.exports='))" && echo "worker parses"

      - name: Check for rebuilt file
        id: check
        run: |
          if git diff --quiet -- anyonemap-worker.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit — build produced identical output."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- anyonemap-worker.js
          fi

      - name: Commit and push rebuilt worker
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anyonemap-worker.js
          git commit -m "build(ci): rebuild anyonemap-worker.js from index.html [skip ci]"
          git push origin main
